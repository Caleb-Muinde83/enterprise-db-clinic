services:
  sqlserver_old:
    image: mcr.microsoft.com/mssql/server:2017-latest
    container_name: clinic_mssql_old
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Clinic!2017"
      MSSQL_PID: Developer
    ports:
      - "14330:1433"
    volumes:
      - mssql_old_data:/var/opt/mssql
      - ../../data:/data   # mounts generated CSVs so BULK INSERT can read them server-side
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    # Development happens here for every module up through zero-downtime migration.

  sqlserver_new:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: clinic_mssql_new
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Clinic!2022"
      MSSQL_PID: Developer
    ports:
      - "14333:1433"
    volumes:
      - mssql_new_data:/var/opt/mssql
    # Stays empty/unused until the version-migration module, which migrates
    # sqlserver_old (carrying every prior fix) into this container.

volumes:
  mssql_old_data:
  mssql_new_data:
